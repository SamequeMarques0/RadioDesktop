<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Rádio Player Slide</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: transparent;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .player-card {
      width: 320px;
      background: #1e1e2e;
      border-radius: 12px;
      padding: 15px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);

      /* Permite mover a janela sem bordas */
      -webkit-app-region: drag;

      /* Borda RGB Animada */
      border: 3px solid transparent;
      background-image: 
        linear-gradient(#1e1e2e, #1e1e2e), 
        linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bfd, #7a00ff, #ff00c8, #ff0000);
      background-origin: border-box;
      background-clip: padding-box, border-box;
      background-size: 200% 200%;
      animation: rgbEffect 2s linear infinite;
    }

    @keyframes rgbEffect {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
      100% { background-position: 0% 0%; }
    }

    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .btn-action {
      background: #313244;
      color: #cdd6f4;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      transition: background 0.2s;
      -webkit-app-region: no-drag;
    }

    .btn-action:hover { background: #45475a; }

    .clock-display {
      font-size: 12px;
      font-weight: bold;
      color: #a6e3a1;
      background: #313244;
      padding: 6px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      user-select: none;
    }

    .slide-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 0;
    }

    .btn-arrow {
      background: none;
      border: none;
      color: #f9e2af;
      font-size: 24px;
      cursor: pointer;
      padding: 0 10px;
      user-select: none;
      -webkit-app-region: no-drag;
    }

    .btn-arrow:hover { color: #fff; }

    .station-display {
      text-align: center;
      flex: 1;
      overflow: hidden;
    }

    .station-name {
      font-size: 16px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .station-rank {
      font-size: 11px;
      color: #a6adc8;
      margin-top: 4px;
    }

    /* Container e Input de Volume */
    .volume-container {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 0 0 0;
      -webkit-app-region: no-drag;
    }

    .volume-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #313244;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f9e2af;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .volume-text {
      font-size: 11px;
      color: #a6adc8;
      width: 32px;
      text-align: right;
      font-weight: bold;
    }

    audio { display: none; }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="top-controls">
      <button class="btn-action" onclick="sairApp()">Sair</button>
      <div class="clock-display" id="clock">00 Set / 00:00:00</div>
      <button class="btn-action" id="muteBtn" onclick="toggleMute()">Mute</button>
    </div>

    <hr style="border: 0; border-top: 1px solid #313244; margin: 10px 0;">

    <div class="slide-container">
      <button class="btn-arrow" onclick="mudarRadio(-1)">&lt;</button>
      
      <div class="station-display">
        <div class="station-name" id="radioName">Carregando...</div>
        <div class="station-rank" id="radioInfo">#1 • IBOPE</div>
      </div>

      <button class="btn-arrow" onclick="mudarRadio(1)">&gt;</button>
    </div>
    
    <hr style="border: 0; border-top: 1px solid #313244; margin: 10px 0;">

    <!-- Barra de Controle de Volume -->
    <div class="volume-container">
      <span style="font-size: 12px; color: #a6adc8;">🔊</span>
      <input type="range" id="volumeControl" class="volume-slider" min="0" max="100" value="80" oninput="alterarVolume(this.value)">
      <span class="volume-text" id="volumeVal">80%</span>
    </div>
  </div>

  <audio id="audioPlayer" autoplay></audio>

  <script>
    let radios = [];
    let currentIndex = 0;
    const player = document.getElementById('audioPlayer');
    const volumeControl = document.getElementById('volumeControl');
    const volumeVal = document.getElementById('volumeVal');

    const meses = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];

    function atualizarRelogio() {
      const agora = new Date();
      const dia = String(agora.getDate()).padStart(2, '0');
      const mes = meses[agora.getMonth()];
      const horas = String(agora.getHours()).padStart(2, '0');
      const minutos = String(agora.getMinutes()).padStart(2, '0');
      const segundos = String(agora.getSeconds()).padStart(2, '0');

      document.getElementById('clock').innerText = `${dia} ${mes} / ${horas}:${minutos}:${segundos}`;
    }

    setInterval(atualizarRelogio, 1000);
    atualizarRelogio();

    async function initPlayer() {
      try {
        const response = await fetch('./radios.json');
        radios = await response.json();
        
        // Carrega a preferência de volume salva
        const savedVolume = localStorage.getItem('playerVolume');
        if (savedVolume !== null) {
          volumeControl.value = savedVolume;
          alterarVolume(savedVolume);
        } else {
          alterarVolume(80); // Padrão 80%
        }

        if (radios.length > 0) {
          const savedIndex = localStorage.getItem('lastStationIndex');
          if (savedIndex !== null && savedIndex < radios.length) {
            currentIndex = parseInt(savedIndex, 10);
          }
          carregarRadio(currentIndex);
        }
      } catch (err) {
        document.getElementById('radioName').innerText = "Erro no JSON";
      }
    }

    function carregarRadio(index) {
      const radio = radios[index];
      document.getElementById('radioName').innerText = radio.nome;
      document.getElementById('radioInfo').innerText = `${radio.praca}`;
      
      localStorage.setItem('lastStationIndex', index);

      player.src = radio.stream_url;
      player.play().catch(err => {
        console.log("Autoplay aguardando interação:", err);
      });
    }

    function mudarRadio(direcao) {
      if (radios.length === 0) return;
      
      currentIndex += direcao;

      if (currentIndex < 0) {
        currentIndex = radios.length - 1;
      } else if (currentIndex >= radios.length) {
        currentIndex = 0;
      }

      carregarRadio(currentIndex);
    }

    // Função para alterar o volume dinamicamente
    function alterarVolume(valor) {
      const volumeFloat = valor / 100;
      player.volume = volumeFloat;
      volumeVal.innerText = `${valor}%`;
      
      // Se o usuário ajustar o slider manualmente enquanto estiver Mute, remove o Mute
      if (player.muted && valor > 0) {
        player.muted = false;
        document.getElementById('muteBtn').innerText = 'MUTE';
      }

      localStorage.setItem('playerVolume', valor);
    }

    function toggleMute() {
      player.muted = !player.muted;
      const muteBtn = document.getElementById('muteBtn');

      if (player.muted) {
        muteBtn.innerText = 'UNMUTE';
        volumeVal.innerText = '0%';
      } else {
        muteBtn.innerText = 'MUTE';
        volumeVal.innerText = `${volumeControl.value}%`;
      }
    }

    function sairApp() {
      window.close();
    }

    initPlayer();
  </script>
</body>
</html>
